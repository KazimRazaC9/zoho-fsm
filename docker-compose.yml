services:
  postgres:
    image: postgres:16-alpine
    container_name: fieldserve-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fieldserve
      POSTGRES_PASSWORD: fieldserve
      POSTGRES_DB: fieldserve
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldserve -d fieldserve"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: fieldserve-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI -> http://localhost:8025

volumes:
  pgdata:
